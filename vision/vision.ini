; ============================================================================
;  vision.ini —— 视觉引导防摇 · 视觉模块配置
;  改完直接重启 vs_tuner.exe / vs_vision.dll 生效，不需要重新编译
;  布尔值：1/0、true/false、on/off 都认
; ============================================================================

[camera]
; 留空 = 用第一台找到的 D415；多台时填序列号（如 751412060675）
serial=
depth_width=640
depth_height=480
color_width=640
color_height=480
fps=30

; ★ 深度对齐到彩色，必须开。
; D415 的彩色和深度是两个镜头，视场不同；不对齐时检测框和深度像素错位，
; 定位误差能到几十厘米（论文 4.5 节踩过这个坑）。
align_depth_to_color=1

; ---------------------------------------------------------------------------
; 检测器选择：color（彩色标记，默认，不依赖训练）
;             yolo （训练好的权重，见下面 [yolo] 段）
;             none （只测深度，不检测）
; ---------------------------------------------------------------------------
[detector]
type=yolo

; ---- 彩色标记参数 ----
; 先用 vs_tuner 的滑条现场调到只有标记被框住，再按 w 把数值抄回来。
; 红色标记把 h_min 设成 170、h_max 设成 10（跨 0 度，内部会自动两段合并）。
[color]
h_min=0
h_max=15
s_min=120
s_max=255
v_min=80
v_max=255

; 标记面积门限(像素²)：640x480 下直径 20 px 的圆约 314
min_area=150
; 0 = 不限上限。背景有更大的同色物体时用它卡死
max_area=0

; 形态学：开运算去小噪点，闭运算补空洞。0 = 关闭
morph_open=1
morph_close=1

; 限定搜索区域，0 宽/高 = 全图。背景有同色干扰时用
roi_x=0
roi_y=0
roi_w=0
roi_h=0

; 质心算法：1 = 轮廓矩(默认，圆标记最稳)  0 = 最小外接圆圆心
use_moments=1

; ---------------------------------------------------------------------------
; YOLO 检测（把 detector.type 改成 yolo 后生效）
;
;   当前模型：yolo11-mix，2026-11-07 训练，单类 grab，
;             2026-11-08 由 ultralytics 项目的 export.py 导出为 best.onnx。
;   导出请用：conda activate yolo11 && python export.py
;             （不要用 yolo export ... opset=12，见下）
;
;   ★ opset 必须是 16：neck 里的 DySample 上采样会生成 GridSample 算子，
;     opset 12 根本导不出来。OpenCV 4.7 DNN 原本不认识 GridSample，
;     现在由 vs_gridsample.hpp 注册自定义层补齐，并已重新编译 DLL/EXE。
;     换 OpenCV 版本 / 换推理后端时，务必确认这一层仍然可用。
;   ★ 导出脚本还把 CondConv 的动态卷积核改写成「专家静态卷积 + 路由加权」，
;     且用切片代替标量索引，使 ONNX 里 Gather 节点为 0（OpenCV 4.7 跑不了 Gather）。
;     自己重新导出时别把这两处改回去。
;
;   - imgsz 必须和 input_w / input_h 一致，否则检测框整体偏移
;   - 不加 nms=True：输出 [1, 4+nc, N]，程序自动转置，走 v8/v11 头
;   - 加了 nms=True：输出 [1, 300, 6]，程序认成 nms 格式并跳过二次 NMS
;   - nc=1 的单类别模型只输出 5 列，属正常，不是模型坏了
;
;   路径可写相对路径（相对 exe 目录，也就是本文件所在目录）
;   head：auto = 按列数自动判断（yolo11 用这个）
;         v8   = 4+nc，无 obj 项
;         v5   = 5+nc，conf=obj×cls（只有 yolov5 需要）
;         nms  = x1,y1,x2,y2,score,cls
; ---------------------------------------------------------------------------
[yolo]
model_type=onnx
; 模型文件就在本文件同目录，所以只写文件名。
; 相对路径的基准是【本 ini 所在目录】，不是 exe/DLL 所在目录。
onnx=best.onnx
; 走 darknet 时才用这两个（yolov3/v4-tiny 那类老模型）
cfg=
weights=

input_w=640
input_h=640
head=auto

; 等比缩放 + 灰边填充，和训练时一致。关掉就变拉伸：640x480 拉成 640x640，
; 竖直方向被压 25%，小目标明显掉点
letterbox=1

conf=0.40
nms=0.45
; -1 = 不筛选类别；否则只接受该 class id
class_id=-1
; 类别数。0 = 按输出列数自动推。
; best.onnx（2026-11-08 导出）实测输出 [1, 5, 8400] → 5-4 = 1 个类别（grab）。
; 换模型后 nc 和 names 两个都要改，否则标注上的类别名是错的
nc=1
; YOLO 按 RGB 训练，OpenCV 读进来是 BGR，这里要 1
swap_rb=1
; 归一化系数，常规模型 1/255=0.003922
scale=0.003922
; 仅用于标注上显示的文字，逗号分隔，顺序必须和模型里的 class id 一致。
; best.onnx（2026-11-08 导出）元数据里是 {0:'grab'}，输出 [1,5,8400] = 4+1 类
names=grab

; ---------------------------------------------------------------------------
; 标定
;
;   u0/v0 = 吊重静止垂下时的质心像素，也就是"竖直中心线"（按 z 键自动写入）
;   angle_mode=0  物理法：θ = atan( ΔX / rope_len_mm )，推荐
;                 不受分辨率、安装距离影响，换位置只要重标 u0/v0
;   angle_mode=1  两点法：θ = ang_k × (u-u0)，k 单位 度/像素
;
;   rope_len_mm 是【吊重质心】到【悬点】的距离，不是绳长全长。
;   卷筒 Φ10，吊绳从卷筒下来，量一下静止时"出绳点到标记中心"的直线距离填这里。
;   这个值填小了，摆角读数会整体偏大，成正比缩放。
; ---------------------------------------------------------------------------
[calib]
u0=320
v0=240
z0_mm=0
angle_mode=0
rope_len_mm=0
ang_k=0.05

; ---------------------------------------------------------------------------
; 滤波
;   ema   0~1，越大越跟手、越小越平滑。1 = 不滤波
;   td_r  跟踪微分器的跟踪速度（度/秒²量级）。小一点角速度干净，大一点响应快
; ---------------------------------------------------------------------------
[filter]
ema=0.6
td_r=60

; ---------------------------------------------------------------------------
; 输出
;   log_csv=1 时每帧写一行到 log_dir，文件名带启动时间，供离线画曲线
;   列：host_us,dev_us,frame,valid,u,v,z_mm,off_x_mm,angle_deg,rate_dps,conf,lost
; ---------------------------------------------------------------------------
[out]
log_csv=1
log_dir=logs

; 「存图」按钮输出哪种画面：
;   1 = 未标注的相机原始彩色帧（画面里没有检测框、类别标签、中心线和文字）
;       —— 采集 YOLO 训练集必须用这个，带框图会被模型学成特征
;   0 = 带检测框和读数的画面（做实验记录/截图用）
; 改完重启上位机生效。vs_tuner.exe 里 s 永远是带框、r 永远是原始帧，不受此项影响。
snapshot_raw=1
